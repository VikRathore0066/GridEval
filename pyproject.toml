[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grideval"
version = "0.1.0"
description = "GridEval: Classical ML vs TSFM benchmark for electricity load forecasting (accuracy + calibration)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "lightgbm==4.5.0",
    "xgboost==2.1.1",
    "prophet==1.1.5",
    "chronos-forecasting>=1.3.0",
    "timesfm>=1.0.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "plotly==5.24.1",
    "pyyaml==6.0.1",
    "tqdm==4.66.5",
]

[project.optional-dependencies]
dev = ["jupyterlab==4.2.5", "ipykernel==6.29.5", "streamlit==1.39.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]