[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grideval"
version = "0.1.0"
description = "GridEval: Classical ML vs TSFM benchmark for electricity load forecasting (accuracy + calibration)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pyarrow==17.0.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.51.0", "plotly==5.24.1"]
training = [
    "lightgbm==4.5.0",
    "xgboost==2.1.1",
    "chronos-forecasting==1.3.0",
    "torch==2.5.1",
    "transformers==4.48.3",
    "accelerate==1.15.0",
    "matplotlib==3.9.2",
]
notebooks = [
    "jupyterlab==4.2.5",
    "ipykernel==6.29.5",
    "matplotlib==3.9.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
